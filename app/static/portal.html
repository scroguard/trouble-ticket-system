<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{SITE_NAME}}</title>
  <meta name="site-name" content="{{SITE_NAME}}">
  <meta name="portal-max-files" content="{{PORTAL_MAX_FILES}}">
  <script src="/static/theme.js"></script>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        integrity="sha384-XGjxtQfXaH2tnPFa9x+ruJTuLE3Aa6LhHSWRr1XeTyhezb4abCG4ccI5AkVDxqC+"
        crossorigin="anonymous">
  <link rel="stylesheet" href="/static/portal.css?v=2">
  <script defer
          src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
          crossorigin="anonymous"></script>
  <script defer src="/static/portal.js?v=3"></script>
</head>
<body>
<header class="portal-header border-bottom">
  <div class="portal-container d-flex align-items-center gap-2">
    <a class="brand" href="#/"><i class="bi bi-life-preserver text-primary"></i><span id="brand-name">{{SITE_NAME}}</span></a>
    <div id="account" class="ms-auto d-flex align-items-center gap-2 d-none">
      <span id="account-email" class="small text-body-secondary text-truncate"></span>
      <button id="logout" type="button" class="btn btn-sm btn-outline-secondary">Sign out</button>
    </div>
  </div>
</header>

<main class="portal-container py-4">
  <div id="view" aria-live="polite">
    <div class="text-center py-5"><div class="spinner-border text-secondary" role="status"><span class="visually-hidden">Loading…</span></div></div>
  </div>
</main>

<div id="toasts" class="toast-container position-fixed bottom-0 end-0 p-3"></div>
</body>
</html>
